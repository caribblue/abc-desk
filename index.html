<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f8f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="도담플래너" />
    <title>도담플래너</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="dodam_512.png" />
    <link rel="apple-touch-icon" href="dodam_512.png" />
    <link
      rel="stylesheet"
      media="(min-width: 1100px)"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      :root {
        --ink: #18283d;
        --muted: #68776e;
        --green: #176b46;
        --leaf: #c7f2cc;
        --soft: #eaf3eb;
        --bg: #f5f8f5;
        --line: #e1e9e3;
        --red: #a42b36;
        --radius: 22px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button,
      input,
      select,
      textarea,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        border: 0;
        background: none;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #469773;
        outline-offset: 3px;
      }
      input,
      textarea,
      select {
        width: 100%;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        color: var(--ink);
        min-height: 46px;
      }
      textarea {
        resize: vertical;
        line-height: 1.7;
      }
      input[type="checkbox"] {
        width: 20px;
        min-height: 20px;
        accent-color: var(--green);
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid #8ec7a4;
        outline-offset: 1px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 34px;
        letter-spacing: -1.3px;
        line-height: 1.3;
      }
      h2 {
        font-size: 19px;
        letter-spacing: -0.5px;
      }
      h3 {
        font-size: 16px;
      }
      small,
      .sub {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      .icon {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: var(--soft);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.7px;
        white-space: nowrap;
      }
      .brand img {
        width: 34px;
        height: 39px;
        object-fit: contain;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .primary {
        background: var(--green);
        color: white;
        border-radius: 16px;
        min-height: 48px;
        padding: 12px 22px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .secondary {
        background: var(--soft);
        border-radius: 14px;
        padding: 12px 18px;
        min-height: 46px;
        font-weight: 600;
      }
      .danger {
        color: var(--red);
      }
      .text-btn {
        color: var(--green);
        font-size: 13px;
        font-weight: 650;
        min-height: 44px;
        padding: 8px;
      }
      .glass {
        background: rgba(255, 255, 255, 0.73);
        border: 1px solid rgba(255, 255, 255, 0.95);
        box-shadow:
          0 10px 32px #183e2420,
          inset 0 1px 1px #fff,
          inset 0 -1px 1px #adc3b259;
        backdrop-filter: blur(22px) saturate(165%);
        -webkit-backdrop-filter: blur(22px) saturate(165%);
      }
      .glass-action {
        background: linear-gradient(
          135deg,
          rgba(36, 130, 88, 0.94),
          rgba(19, 98, 63, 0.88)
        );
        border: 1px solid #ffffff70;
        box-shadow:
          0 8px 24px #176b4629,
          inset 0 1px 1px #ffffff85;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      #login {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at top right, #d7efdc, transparent 60%),
          var(--bg);
      }
      .login-card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid var(--line);
        padding: 32px;
        border-radius: 28px;
        box-shadow: 0 15px 60px #1736240c;
      }
      .login-card .brand {
        margin-bottom: 32px;
      }
      .login-card h1 {
        font-size: 26px;
        margin-bottom: 10px;
      }
      .login-card form {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }
      label {
        display: grid;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
      }
      .error {
        color: var(--red);
        font-size: 14px;
        line-height: 1.6;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
      }
      .status.error {
        color: var(--red);
      }
      #app {
        max-width: 1600px;
        margin: auto;
        padding: 28px 40px 50px 256px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 34px;
      }
      .topbar .brand {
        display: none;
      }
      .account {
        background: #e6eee9;
        border-radius: 50%;
        font-size: 13px;
        font-weight: 700;
      }
      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;
      }
      .page-head .sub {
        margin-bottom: 5px;
      }
      #navigation {
        position: fixed;
        left: 20px;
        top: 24px;
        bottom: 24px;
        width: 202px;
        border-radius: 26px;
        padding: 24px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 20;
      }
      #navigation .brand {
        font-size: 17px;
        margin: 0 5px 32px;
      }
      #navigation button {
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 15px;
        padding: 15px 18px;
        min-height: 52px;
        font-size: 15px;
        font-weight: 600;
        text-align: left;
        transition:
          background 0.18s,
          color 0.18s;
      }
      #navigation button.active {
        background: var(--soft);
        color: var(--green);
      }
      #navigation button.active .icon {
        stroke-width: 2.4;
      }
      .nav-foot {
        margin-top: auto;
        padding: 18px 10px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
      }
      .page {
        animation: appear 0.18s ease;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(290px, 0.8fr);
        gap: 26px;
        align-items: start;
      }
      .stack {
        display: grid;
        gap: 24px;
      }
      .surface {
        border-radius: var(--radius);
        background: #fff;
        border: 1px solid #edf1ed;
        padding: 24px;
        min-width: 0;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .section-head .sub {
        margin-left: 8px;
      }
      .week-strip {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        margin-bottom: 24px;
      }
      .day-pill {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 72px;
        border-radius: 19px;
        font-size: 17px;
      }
      .day-pill small {
        font-size: 12px;
      }
      .day-pill.selected {
        background: var(--green);
        color: #fff;
        box-shadow: 0 4px 12px #176b4620;
      }
      .day-pill.selected small {
        color: #d7ecdf;
      }
      .day-pill.today:not(.selected) {
        background: var(--soft);
      }
      .summary {
        background: var(--soft);
        border-radius: 20px;
        padding: 20px 24px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .summary strong {
        font-size: 22px;
        letter-spacing: -0.7px;
      }
      .summary .sub {
        display: block;
        margin-top: 6px;
      }
      .count {
        font-size: 28px;
        font-weight: 800;
        color: var(--green);
        white-space: nowrap;
      }
      .task-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 72px;
        padding: 12px 0;
        border-bottom: 1px solid #eef2ef;
      }
      .task-row:last-child {
        border-bottom: 0;
      }
      .check {
        min-width: 44px;
        width: 44px;
        height: 44px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        padding: 0;
      }
      .check-mark {
        width: 25px;
        height: 25px;
        border: 1.5px solid #98aa9f;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: white;
      }
      .check[aria-pressed="true"] .check-mark {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }
      .check .icon {
        width: 17px;
        height: 17px;
      }
      .task-main {
        text-align: left;
        flex: 1;
        min-width: 0;
        padding: 5px 0;
        line-height: 1.5;
      }
      .task-name {
        font-size: 15px;
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .done .task-name {
        text-decoration: line-through;
        color: var(--muted);
      }
      .task-meta {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
      }
      .tag {
        background: var(--soft);
        border-radius: 6px;
        padding: 1px 6px;
        color: var(--green);
      }
      .empty {
        padding: 28px 12px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
        text-align: center;
      }
      .quick-form {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .quick-form input {
        background: var(--bg);
        border: 0;
        min-width: 0;
      }
      .quick-form button {
        width: 48px;
        padding: 0;
        flex-shrink: 0;
      }
      .event {
        display: flex;
        gap: 18px;
        padding: 18px 0;
        text-align: left;
        width: 100%;
        border-bottom: 1px solid #edf1ed;
        align-items: flex-start;
      }
      .event:last-child {
        border-bottom: 0;
      }
      .event-time {
        font-size: 16px;
        font-weight: 750;
        min-width: 50px;
      }
      .event-content {
        padding-left: 14px;
        border-left: 3px solid #7bcc9a;
        min-width: 0;
      }
      .event-content strong {
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .event-content small {
        display: block;
        margin-top: 6px;
      }
      .event.past {
        opacity: 0.65;
      }
      .habit-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .habit-pill {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        font-size: 13px;
      }
      .habit-pill[aria-pressed="true"] {
        background: var(--soft);
        border-color: #b8ddc5;
        color: var(--green);
      }
      .habit-pill .icon {
        width: 17px;
        height: 17px;
      }
      .quick-note {
        width: 100%;
        text-align: left;
        background: var(--soft);
        padding: 18px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--green);
      }
      .search {
        max-width: 360px;
      }
      .filters {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 20px;
        flex-wrap: wrap;
      }
      .chip {
        min-height: 40px;
        padding: 9px 17px;
        border-radius: 30px;
        background: #edf1ee;
        color: var(--muted);
        font-size: 13px;
      }
      .chip.active {
        background: var(--green);
        color: white;
      }
      .calendar-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, 1fr);
        gap: 26px;
        align-items: start;
      }
      .month-head {
        margin-bottom: 18px;
      }
      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }
      .weekday {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        padding: 8px 0;
      }
      .cal-day {
        min-height: 62px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 15px;
      }
      .cal-day:hover {
        background: var(--soft);
      }
      .cal-day.selected {
        background: var(--green);
        color: white;
      }
      .cal-day.is-today:not(.selected) {
        box-shadow: inset 0 0 0 1px #70b28c;
      }
      .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--green);
      }
      .selected .dot {
        background: white;
      }
      .sun {
        color: #ae3f4b;
      }
      .sat {
        color: #46749c;
      }
      .habit-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 1fr);
        gap: 26px;
      }
      .progress {
        height: 7px;
        background: #d7e5db;
        border-radius: 8px;
        margin-top: 16px;
        overflow: hidden;
      }
      .progress span {
        display: block;
        height: 100%;
        background: var(--green);
        border-radius: inherit;
        transition: width 0.2s;
      }
      .habit-summary {
        display: block;
      }
      .habit-summary .count {
        font-size: 40px;
        display: block;
        margin: 8px 0;
      }
      .habit-grid {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 12px;
      }
      .habit-grid th {
        font-weight: 500;
        color: var(--muted);
        padding: 10px 0;
      }
      .habit-grid th:first-child {
        width: 24%;
        text-align: left;
      }
      .habit-grid td {
        padding: 6px 0;
        text-align: center;
      }
      .habit-grid td:first-child {
        text-align: left;
        overflow-wrap: anywhere;
      }
      .habit-grid .mini-check {
        width: 100%;
        min-height: 40px;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .mini-check span {
        width: 20px;
        height: 20px;
        border: 1px solid #a6b8aa;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .mini-check[aria-pressed="true"] span {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }
      .mini-check .icon {
        width: 13px;
        height: 13px;
      }
      .notes-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .note-card {
        padding: 22px;
        border-radius: 20px;
        border: 1px solid #e8eee8;
        background: white;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 176px;
      }
      .note-card.pinned {
        background: var(--soft);
        border-color: #d7e9da;
      }
      .note-card h3 {
        overflow-wrap: anywhere;
        line-height: 1.5;
      }
      .note-card p {
        font-size: 14px;
        line-height: 1.7;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .note-card small {
        margin-top: auto;
      }
      .wide-action {
        margin-top: 18px;
        width: 100%;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 110px;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        padding: 14px 20px;
        border-radius: 16px;
        max-width: 90vw;
        z-index: 150;
        font-size: 14px;
        line-height: 1.6;
        box-shadow: 0 6px 25px #0002;
      }
      #dataAlert {
        padding: 18px;
        margin: 0 0 20px;
        background: #fff1ee;
        border-radius: 16px;
        color: var(--red);
        font-size: 14px;
        line-height: 1.7;
      }
      dialog {
        padding: 0;
        border: 1px solid #fff;
        background: #fff;
        color: var(--ink);
        border-radius: 26px;
        width: min(560px, calc(100% - 32px));
        max-height: 90dvh;
        box-shadow: 0 25px 80px #18283d35;
      }
      dialog::backdrop {
        background: #122e2438;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 2;
      }
      .dialog-body {
        padding: 24px;
        display: grid;
        gap: 20px;
      }
      .dialog-foot {
        padding: 16px 24px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: flex-end;
        background: #fff;
        position: sticky;
        bottom: 0;
        z-index: 2;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .inline-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .inline-label input {
        width: auto;
      }
      details {
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        min-height: 38px;
      }
      details .stack {
        gap: 14px;
        margin-top: 12px;
      }
      .days {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .days label {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 6px;
        min-width: 36px;
      }
      #noteDialog {
        width: min(800px, calc(100% - 32px));
      }
      #noteTitle {
        font-size: 24px;
        font-weight: 750;
        border: 0;
        border-radius: 0;
        padding: 4px 0;
      }
      #noteEditor {
        min-height: 240px;
        overflow-wrap: anywhere;
      }
      .ce-block__content,
      .ce-toolbar__content {
        max-width: 100%;
      }
      .codex-editor__redactor {
        padding-bottom: 70px !important;
      }
      .cdx-block {
        line-height: 1.8;
      }
      .cdx-attaches a {
        color: var(--green);
      }
      .save-hint {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
      }
      .loading {
        padding: 80px 20px;
        text-align: center;
        color: var(--muted);
      }
      .mobile-only {
        display: none;
      }
      .dialog-choices {
        display: grid;
        gap: 12px;
      }
      .dialog-choices button {
        padding: 18px;
        background: var(--soft);
        border-radius: 16px;
        text-align: left;
        font-weight: 600;
      }
      #profileBody {
        overflow-wrap: anywhere;
      }
      @keyframes appear {
        from {
          opacity: 0.3;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (min-width: 1100px) {

    <script>

      const icon = (n) =>
        `<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
      const clone = (v) =>

      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
      function dateKey(d = new Date()) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function parseDate(k) {
        const [y, m, d] = k.split("-").map(Number);
        return new Date(y, m - 1, d);

      function dateLabel(k) {
        return parseDate(k).toLocaleDateString("ko-KR", {

          day: "numeric",
          weekday: "long",

      }
      function shiftDate(k, n) {
        const d = parseDate(k);
        d.setDate(d.getDate() + n);
        return dateKey(d);

      function weekDates(k) {
        const start = shiftDate(k, -parseDate(k).getDay());

      }
      function plain(v) {
        const doc = new DOMParser().parseFromString(

        return doc.body.textContent || "";
      }
      function textOfNote(n) {
        if (typeof n === "string") return plain(n);
        return (n?.blocks || [])

                b.data?.caption ||
                b.data?.file?.name ||
                (b.data?.items || [])
                  .map((x) =>
                    typeof x === "string" ? x : x.text || x.content || "",

                  .join(" "),

      }
      function same(a, b) {

      }
      let user = null,

        ready = false,

        query = "",
        busy = 0;
      let taskEdit = null,

        noteBase = null,

        noteDirty = false,
        noteOpening = false,
        noteSaving = false,
        noteGeneration = 0,
        noteReadOnly = false,
        noteDestroyed = false,
        noteVersion = 0;
      let toastTimer,

      function toast(message) {

      }
      function status(message, error = false) {

        $("syncStatus").classList.toggle("error", error);
      }
      function openDialog(id) {
        lastFocus = document.activeElement;
        $(id).showModal();
      }
      async function closeDialog(id) {
        if (busy || noteSaving) {
          toast("저장이 끝난 뒤 닫아 주세요.");
          return;
        }
        if (
          id === "taskDialog" &&
          taskDirty &&
          !confirm("저장하지 않은 변경을 닫을까요?")
        )
          return;
        if (
          id === "noteDialog" &&
          noteDirty &&
          !confirm("저장하지 않은 메모를 닫을까요?")
        )
          return;
        $(id).close();
        if (id === "noteDialog") {
          noteGeneration++;
          if (noteEditor) {
            try {
              await noteEditor.isReady;
              noteEditor.destroy();
            } catch {}
            noteEditor = null;
          }
          noteDirty = false;
          noteOpening = false;
          noteReadOnly = false;
        }
        taskDirty = false;
        lastFocus?.focus?.();
      }
      function occurs(t, k) {
        const start = dateKey(new Date(Number(t.createDate)));
        if (!Number.isFinite(Number(t.createDate)) || k < start) return false;
        const d = parseDate(k),
          s = parseDate(start);
        switch (t.repeat) {
          case "daily":
            return true;
          case "weekly":
            return (t.repeatDays || []).includes(weekdays[d.getDay()]);
          case "monthly":
            return d.getDate() === s.getDate();
          case "yearly":
            return d.getMonth() === s.getMonth() && d.getDate() === s.getDate();
          default:
            return k === start;
        }
      }
      function done(t, k = selected) {
        return (t.completedDates || []).includes(k);
      }
      function matches(t) {
        return (
          !query ||
          `${t.task} ${(t.tags || []).join(" ")} ${t.memo || ""}`
            .toLowerCase()
            .includes(query.toLowerCase())
        );
      }
      function tasksFor(k) {
        return (data.todos || []).filter(
          (t) => t.isTask && !t.isHabit && occurs(t, k),
        );
      }
      function eventsFor(k) {
        return (data.todos || [])
          .filter((t) => !t.isTask && !t.isHabit && occurs(t, k))
          .sort((a, b) =>
            (a.startTime || "00:00").localeCompare(b.startTime || "00:00"),
          );
      }
      function habitsFor(k) {
        return (data.todos || []).filter((t) => t.isHabit && occurs(t, k));
      }
      function repeatText(t) {
        return {
          daily: "매일",
          weekly: (t.repeatDays || []).join("·"),
          monthly: "매월",
          yearly: "매년",
          none: "한 번",
        }[t.repeat || "none"];
      }
      function streak(t) {
        let k = dateKey(),
          count = 0;
        const start = dateKey(new Date(Number(t.createDate)));
        for (let i = 0; i < 3660 && k >= start; i++, k = shiftDate(k, -1)) {
          if (!occurs(t, k)) continue;
          if (done(t, k)) {
            count++;
            continue;
          }
          if (k === dateKey()) continue;
          break;
        }
        return count;
      }
      function dateControls() {
        return `<div class="row" style="gap:2px"><button class="icon-btn" data-action="prev" aria-label="이전 날짜">${icon("left")}</button><label class="icon-btn" aria-label="날짜 선택" style="position:relative">${icon("calendar")}<input type="date" value="${selected}" id="datePicker" aria-label="날짜 선택" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label><button class="icon-btn" data-action="next" aria-label="다음 날짜">${icon("right")}</button></div>`;
      }
      function heading(title, extra = "") {
        return `<div class="page-head"><div><p class="sub">${tab === "today" ? esc(dateLabel(selected)) : tab === "habits" ? "작은 실천을 꾸준히" : "나의 기록, 나의 속도로"}</p><h1>${title}</h1></div>${extra}</div>`;
      }

      }
      function weekStrip() {
        return `<div class="week-strip">${weekDates(selected)

              `<button class="day-pill ${k === selected ? "selected" : ""} ${k === dateKey() ? "today" : ""}" data-date="${k}" aria-label="${dateLabel(k)}" aria-pressed="${k === selected}"><small>${weekdays[parseDate(k).getDay()]}</small>${parseDate(k).getDate()}</button>`,

          t.tags || []
        )
          .slice(0, 2)
          .map((x) => `<span>#${esc(x)}</span>`)
          .join(
            "",
          )}</span></button><button class="icon-btn" data-edit="${esc(t.id)}" aria-label="${esc(t.task)} 상세">${icon("right")}</button></div>`;
      }
      function eventRow(t, k = selected) {
        const past =
          k === dateKey() &&
          t.endTime &&
          t.endTime < new Date().toTimeString().slice(0, 5);
        return `<button class="event ${past ? "past" : ""}" data-edit="${esc(t.id)}"><span class="event-time">${t.isAllDay || !t.startTime ? "종일" : esc(t.startTime)}</span><span class="event-content"><strong>${esc(t.task)}</strong><small>${esc(t.isAllDay ? "종일" : `${t.startTime || ""}${t.endTime ? "–" + t.endTime : ""}`)}${past ? " · 종료" : ""}</small></span></button>`;
      }
      function renderToday() {
        const todayTasks = tasksFor(selected),
          completed = todayTasks.filter((t) => done(t)).length;

          .filter(matches)

            (a, b) =>
              Number(
                done(
                  a,
                  taskFilter === "all"
                    ? dateKey(new Date(Number(a.createDate)))

              ) -
                Number(
                  done(
                    b,
                    taskFilter === "all"
                      ? dateKey(new Date(Number(b.createDate)))

              ({ A: 0, B: 1, C: 2 }[a.type] ?? 1) -
                ({ A: 0, B: 1, C: 2 }[b.type] ?? 1),

        const habits = habitsFor(selected),
          events = eventsFor(selected);
        return (
          heading(
            selected === dateKey() ? "오늘" : dateLabel(selected),

              .join("") ||
            empty("할 일이 없습니다. 작은 일부터 하나 적어보세요.")
          }${pcQuickTaskForm()}</section><section class="surface"><div class="section-head"><h2>오늘의 습관</h2><button class="text-btn" data-go="habits">주간 기록 ›</button></div>${habits.map((t) => `<div class="pc-row"><button class="check" data-toggle="${esc(t.id)}" data-day="${selected}" aria-pressed="${done(t)}" aria-label="${esc(t.task)} 완료 체크" ${selected > dateKey() ? "disabled" : ""}><span class="check-mark">${done(t) ? icon("check") : ""}</span></button><button class="pc-task-link" data-edit="${esc(t.id)}"><span class="pc-task-title">${esc(t.task)}</span></button><div class="pc-dots" aria-label="이번 주 완료 기록">${week.map((k) => `<span title="${dateLabel(k)} ${done(t, k) ? "완료" : "미완료"}" class="${k > dateKey() ? "future" : done(t, k) ? "checked" : ""}"></span>`).join("")}</div></div>`).join("") || empty("오늘 예정된 습관이 없습니다.")}</section></div><aside class="pc-stack"><section class="surface"><div class="section-head"><h2>오늘의 일정</h2><button class="text-btn" data-go="schedule">전체 보기 ›</button></div>${events.map((t) => eventRow(t)).join("") || empty("예정된 일정이 없습니다.")}</section><section class="surface"><h2>빠른 메모</h2><form class="pc-note-form" id="pcMemoForm"><textarea id="pcMemoText" maxlength="10000" required aria-label="빠른 메모" placeholder="떠오른 생각을 적어보세요">${esc(pcQuickMemo)}</textarea><div class="row between"><small>작성한 내용은 메모에 저장됩니다.</small><button class="primary" ${pcMemoSaving ? "disabled" : ""}>저장</button></div><p id="pcMemoError" class="error" role="alert"></p></form></section><section class="surface"><div class="section-head"><h2>최근 메모</h2><button class="text-btn" data-go="notes">전체 보기 ›</button></div>${recent.map((n) => `<button class="pc-recent" data-note="${esc(n.key)}">${icon("note")}<span>${esc(n.meta.title || (/^\d{4}-\d{2}-\d{2}$/.test(n.key) ? n.key + " 메모" : "제목 없는 메모"))}</span></button>`).join("") || empty("저장된 메모가 없습니다.")}</section></aside></div>`
        );
      };
      function renderDesktopTasks() {
        const all = data.todos.filter((t) => t.isTask && !t.isHabit),
          isAll = pcTaskFilter === "all";
        let rows = [];
        if (isAll)
          rows = all.map((t) => ({
            t,
            k: dateKey(new Date(Number(t.createDate))),
          }));
        else if (pcTaskFilter === "today")
          rows = tasksFor(selected).map((t) => ({ t, k: selected }));
        else
          for (let i = 1; i <= 30; i++) {
            const k = shiftDate(selected, i);
            rows.push(...tasksFor(k).map((t) => ({ t, k })));
          }
        rows = rows
          .filter(({ t }) => matches(t))
          .sort(
            (a, b) =>
              a.k.localeCompare(b.k) ||
              Number(done(a.t, a.k)) - Number(done(b.t, b.k)) ||
              ({ A: 0, B: 1, C: 2 }[a.t.type] ?? 1) -
                ({ A: 0, B: 1, C: 2 }[b.t.type] ?? 1),
          );
        return (
          pcHeading(
            "할 일",
            "해야 할 일을 한 곳에서 정리하세요",
            addButton("task", "할 일 추가"),
          ) +
          `<div class="pc-grid"><section class="surface"><div class="pc-toolbar"><div class="pc-tabs">${[
            ["today", "선택한 날"],
            ["upcoming", "예정 30일"],
            ["all", "전체"],
          ]
            .map(
              ([v, n]) =>
                `<button data-pc-task-filter="${v}" aria-pressed="${pcTaskFilter === v}">${n}</button>`,
            )
            .join(
              "",
            )}</div><input id="taskSearch" class="pc-search" type="search" placeholder="할 일 검색" aria-label="할 일 검색" value="${esc(query)}"></div><div class="row between"><p class="sub">${isAll ? "반복 항목은 한 번만 표시하며 완료는 시작일 기준입니다." : esc(dateLabel(selected))}</p>${dateControls()}</div>${rows.map(({ t, k }) => pcTaskRow(t, k, pcTaskFilter !== "today")).join("") || empty("해당하는 할 일이 없습니다.")}${pcQuickTaskForm()}</section>${pcHint("할 일 상세", "항목을 선택하면 이곳에서 날짜, 중요도, 반복과 메모를 수정할 수 있습니다.")}</div>`
        );
      }
      function pcEventPositions(events) {
        const timed = events
          .filter((t) => !t.isAllDay && t.startTime)
          .map((t) => ({
            t,
            start: pcMinutes(t.startTime),
            end: Math.max(
              pcMinutes(t.endTime || t.startTime),
              pcMinutes(t.startTime) + 24,
            ),
          }))
          .sort((a, b) => a.start - b.start || a.end - b.end);
        let group = [],
          groupEnd = -1;
        function layout() {
          const ends = [];
          for (const item of group) {
            let lane = ends.findIndex((end) => end <= item.start);
            if (lane < 0) lane = ends.length;
            ends[lane] = item.end;
            item.lane = lane;
          }
          for (const item of group) item.lanes = ends.length;
        }
        for (const item of timed) {
          if (item.start >= groupEnd) {
            layout();
            group = [];
            groupEnd = -1;
          }
          group.push(item);
          groupEnd = Math.max(groupEnd, item.end);
        }
        layout();
        return timed;
      }
      function pcMinutes(time) {
        const [h, m] = String(time || "00:00")
          .split(":")
          .map(Number);
        return Math.max(0, Math.min(1439, (h || 0) * 60 + (m || 0)));
      }
      function pcWeekCalendar() {
        const week = pcWeek();
        return `<div class="pc-week-scroll" id="pcWeekScroll" tabindex="0" aria-label="주간 일정표, 세로로 스크롤하여 모든 시간 보기"><div class="pc-week"><div class="pc-week-head"><span></span>${week.map((k) => `<button class="${k === dateKey() ? "is-today" : ""}" data-date="${k}" aria-label="${dateLabel(k)}">${weekdays[parseDate(k).getDay()]}<strong>${parseDate(k).getDate()}</strong></button>`).join("")}</div><div class="pc-all-day"><span>종일</span>${week
          .map(
            (k) =>
              `<div>${eventsFor(k)
                .filter((t) => t.isAllDay || !t.startTime)
                .map(
                  (t) =>
                    `<button data-edit="${esc(t.id)}">${esc(t.task)}</button>`,
                )
                .join("")}</div>`,
          )
          .join(
            "",
          )}</div><div class="pc-week-body"><div class="pc-hours">${Array.from({ length: 24 }, (_, h) => `<span style="top:${h * 60}px">${String(h).padStart(2, "0")}:00</span>`).join("")}</div>${week
          .map(
            (k) =>
              `<div class="pc-day-track">${Array.from({ length: 24 }, (_, h) => `<button class="pc-slot" style="top:${h * 60}px" data-pc-slot="${k}" data-hour="${h}" aria-label="${dateLabel(k)} ${h}시 일정 추가"></button>`).join("")}${pcEventPositions(
                eventsFor(k),
              )
                .map(
                  ({ t, start, end, lane, lanes }) =>
                    `<button class="pc-event-block" data-edit="${esc(t.id)}" title="${esc(t.task)} ${esc(t.startTime)}–${esc(t.endTime || "")}" style="top:${start}px;height:${Math.min(1440 - start, Math.max(24, end - start))}px;left:calc(${(lane * 100) / lanes}% + 2px);width:calc(${100 / lanes}% - 4px)">${esc(t.task)}<span>${esc(t.startTime)}${t.endTime ? "–" + esc(t.endTime) : ""}</span></button>`,
                )
                .join("")}</div>`,
          )
          .join("")}</div></div></div>`;
      }
      renderSchedule = function () {
        if (!pcMedia.matches) return pcMobile.renderSchedule();
        const week = pcWeek(),
          rows = eventsFor(selected);
        let content;
        if (pcScheduleMode === "week") content = pcWeekCalendar();
        else if (pcScheduleMode === "month")
          content = `<div class="pc-month">${calendar()}</div>`;
        else
          content = `<div class="pc-stack">${
            Array.from({ length: 30 }, (_, i) => shiftDate(selected, i))
              .map((k) => {
                const events = eventsFor(k);
                return events.length
                  ? `<section class="surface"><h2>${dateLabel(k)}</h2>${events.map((t) => eventRow(t, k)).join("")}</section>`
                  : "";
              })
              .join("") || empty("선택한 날짜부터 30일 동안 일정이 없습니다.")
          }</div>`;
        return (
          pcHeading(
            "일정",
            "하루의 시간과 한 주의 흐름을 정리하세요",
            addButton("event", "일정 추가"),
          ) +
          `<div class="pc-toolbar"><div class="row"><button class="icon-btn" data-pc-period="-1" aria-label="이전 기간">${icon("left")}</button><h2>${pcScheduleMode === "week" ? esc(week[0] + " – " + week[6]) : esc(dateLabel(selected))}</h2><button class="icon-btn" data-pc-period="1" aria-label="다음 기간">${icon("right")}</button><button class="text-btn" data-action="go-today">오늘</button></div><div class="pc-tabs">${[
            ["month", "월"],
            ["week", "주"],
            ["list", "목록"],
          ]
            .map(
              ([v, n]) =>
                `<button data-pc-schedule="${v}" aria-pressed="${pcScheduleMode === v}">${n}</button>`,
            )
            .join(
              "",
            )}</div></div><div class="pc-grid"><section>${content}</section><aside class="surface"><h2>${dateLabel(selected)}</h2>${rows.map((t) => eventRow(t)).join("") || empty("등록된 일정이 없습니다.")}<p class="sub">일정을 선택하면 이곳에서 수정할 수 있습니다.</p><button class="secondary wide-action" data-action="add-event">+ 일정 추가</button></aside></div>`
        );
      };
      renderHabits = function () {
        if (!pcMedia.matches) return pcMobile.renderHabits();
        const week = pcWeek(),
          all = data.todos.filter((t) => t.isHabit);
        return (
          pcHeading(
            "습관",
            "작은 실천을 꾸준하게",
            addButton("habit", "습관 추가"),
          ) +
          `<div class="pc-toolbar"><div class="row"><button class="icon-btn" data-pc-week="-1" aria-label="지난주">${icon("left")}</button><h2>${week[0]} – ${week[6]}</h2><button class="icon-btn" data-pc-week="1" aria-label="다음주">${icon("right")}</button><button class="text-btn" data-action="go-today">이번 주</button></div><p class="sub">미래 날짜는 완료 체크할 수 없습니다.</p></div><div class="pc-grid"><section class="surface">${all.length ? `<table class="pc-matrix"><thead><tr><th scope="col">습관</th>${week.map((k) => `<th scope="col">${weekdays[parseDate(k).getDay()]}<br>${parseDate(k).getDate()}</th>`).join("")}</tr></thead><tbody>${all.map((t) => `<tr><td><button class="pc-habit-name" data-edit="${esc(t.id)}">${esc(t.task)}</button><p class="sub">${esc(repeatText(t))}</p></td>${week.map((k) => `<td>${occurs(t, k) ? `<button class="mini-check" data-toggle="${esc(t.id)}" data-day="${k}" aria-label="${esc(t.task)} ${dateLabel(k)}" aria-pressed="${done(t, k)}" ${k > dateKey() ? "disabled" : ""}><span>${done(t, k) ? icon("check") : ""}</span></button>` : '<span aria-label="예정 없음">–</span>'}</td>`).join("")}</tr>`).join("")}</tbody></table>` : empty("습관을 추가하면 주간 기록이 표시됩니다.")}</section>${pcHint("습관 상세", "습관 이름을 눌러 반복 요일과 시작일, 메모를 정리하세요.")}</div>`
        );
      };
      renderNotes = function () {
        if (!pcMedia.matches) return pcMobile.renderNotes();
        return (
          pcHeading(
            "메모",
            "떠오른 생각을 차분히 기록하세요",
            addButton("note", "메모 작성"),
          ) +
          `<div class="pc-notes"><section class="surface pc-notes-list"><input id="noteSearch" class="search" type="search" placeholder="메모 검색" aria-label="메모 검색" value="${esc(query)}"><div class="pc-tabs"><button data-note-filter="all" aria-pressed="${noteFilter === "all"}">전체</button><button data-note-filter="pinned" aria-pressed="${noteFilter === "pinned"}">고정</button></div><div class="notes-grid" id="noteCards">${noteCards()}</div></section><section class="surface pc-hint pc-note-placeholder"><h2>생각을 정리하는 공간</h2><p class="sub">왼쪽에서 메모를 선택하면 여기에서 읽고 수정할 수 있습니다.</p><div><button class="secondary" data-action="add-note">+ 새 메모 작성</button></div></section></div>`
        );
      };
      render = function () {
        if (!pcMedia.matches) return pcMobile.render();
        const scroll = $("pcWeekScroll");
        if (scroll) {
          pcWeekScroll = scroll.scrollTop;
        }
        document.body.dataset.pcTab = tab;
        pcMobile.render();
        if ($("pcWeekScroll")) {
          const key = pcWeek()[0];
          if (pcWeekKey !== key) {
            pcWeekKey = key;
            pcWeekScroll = null;
          }
          $("pcWeekScroll").scrollTop = pcWeekScroll ?? 8 * 60 + 70;
        }
        pcMarkSelection();
      };
      function pcMarkSelection() {
        if (!pcMedia.matches) return;
        document
          .querySelectorAll(".pc-notes-list [data-note]")
          .forEach((b) =>
            b.classList.toggle(
              "is-selected",
              $("noteDialog").open && b.dataset.note === noteKey,
            ),
          );
      }
      openDialog = function (id) {
        if (!pcMedia.matches || !["taskDialog", "noteDialog"].includes(id))
          return pcMobile.openDialog(id);
        lastFocus = document.activeElement;
        $(id).show();
      };
      closeDialog = async function (id) {
        await pcMobile.closeDialog(id);
        if (pcMedia.matches) pcMarkSelection();
      };
      async function pcCloseEditors() {
        for (const id of ["taskDialog", "noteDialog"])
          if ($(id).open) {
            await closeDialog(id);
            if ($(id).open) return false;
          }
        return true;
      }
      openTask = async function (kind = "task", id = null) {
        if (!pcMedia.matches) return pcMobile.openTask(kind, id);
        if (pcTransition) return;
        pcTransition = true;
        try {
          if (!(await pcCloseEditors())) return;
          pcMobile.openTask(kind, id);
          return true;
        } finally {
          pcTransition = false;
        }
      };
      openNote = async function (key = null) {
        if (!pcMedia.matches) return pcMobile.openNote(key);
        if (pcTransition) return;
        pcTransition = true;
        try {
          if (!(await pcCloseEditors())) return;
          await pcMobile.openNote(key);
          pcMarkSelection();
        } finally {
          pcTransition = false;
        }
      };
      setTab = async function (value) {
        if (!pcMedia.matches)
          return pcMobile.setTab(value === "tasks" ? "today" : value);
        if (pcTransition) return;
        pcTransition = true;
        try {
          if (!(await pcCloseEditors())) return;
          pcMobile.setTab(value);
        } finally {
          pcTransition = false;
        }
      };
      document.addEventListener("keydown", (e) => {
        if (
          !pcMedia.matches ||
          e.key !== "Escape" ||
          document.querySelector("dialog:modal")
        )
          return;
        const editor = e.target.closest?.(
          "#taskDialog[open], #noteDialog[open]",
        );
        if (
          editor &&
          (e.target.matches("input,textarea,select") ||
            e.target.closest(".dialog-head,.dialog-foot"))
        ) {
          e.preventDefault();
          closeDialog(editor.id);
        }
      });
      pcMedia.addEventListener("change", () => {
        if (!pcMedia.matches && tab === "tasks") {
          tab = "today";
          query = "";
        }
        for (const id of ["taskDialog", "noteDialog"])
          if ($(id).open) {
            $(id).close();
            if (pcMedia.matches) $(id).show();
            else $(id).showModal();
          }
        if (!pcMedia.matches) delete document.body.dataset.pcTab;
        render();
      });
      document.addEventListener("click", async (e) => {
        if (!pcMedia.matches) return;
        const b = e.target.closest("button");
        if (!b || b.disabled) return;
        const d = b.dataset;
        if (d.pcTaskFilter) {
          pcTaskFilter = d.pcTaskFilter;
          render();
        }
        if (d.pcSchedule) {
          pcScheduleMode = d.pcSchedule;
          render();
        }
        if (d.pcWeek) {
          selected = shiftDate(selected, Number(d.pcWeek) * 7);
          render();
        }
        if (d.pcPeriod) {
          const n = Number(d.pcPeriod);
          if (pcScheduleMode === "month") {
            const dt = parseDate(selected);
            dt.setDate(1);
            dt.setMonth(dt.getMonth() + n);
            selected = dateKey(dt);
          } else
            selected = shiftDate(
              selected,
              n * (pcScheduleMode === "week" ? 7 : 30),
            );
          render();
        }
        if (d.pcSlot) {
          if (!(await openTask("event"))) return;
          $("taskDate").value = d.pcSlot;
          const hour = Number(d.hour);
          $("taskStart").value = String(hour).padStart(2, "0") + ":00";
          $("taskEnd").value =
            hour === 23 ? "23:59" : String(hour + 1).padStart(2, "0") + ":00";
          taskDirty = true;
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "pcMemoText") pcQuickMemo = e.target.value;
      });
      document.addEventListener("submit", async (e) => {
        if (e.target.id !== "pcMemoForm") return;
        e.preventDefault();
        if (pcMemoSaving || !pcQuickMemo.trim()) return;
        const text = pcQuickMemo.trim(),
          key = "note_" + uid(),
          now = new Date().toISOString();
        pcMemoSaving = true;
        e.target.querySelector("button").disabled = true;
        try {
          await mutate((d) => ({
            memos: {
              ...(d.memos || {}),
              [key]: {
                blocks: [
                  {
                    type: "paragraph",
                    data: { text: esc(text).replace(/\n/g, "<br>") },
                  },
                ],
              },
            },
            notesMeta: {
              ...(d.notesMeta || {}),
              [key]: {
                title: text.split("\n")[0].slice(0, 60),
                pinned: false,
                createdAt: now,
                updatedAt: now,
              },
            },
          }));
          if (pcQuickMemo.trim() === text) pcQuickMemo = "";
          toast("메모를 저장했습니다.");
        } catch (err) {
          if ($("pcMemoError")) $("pcMemoError").textContent = err.message;
          else toast(err.message);
        } finally {
          pcMemoSaving = false;
          if ($("pcMemoText")) {
            $("pcMemoText").value = pcQuickMemo;
            $("pcMemoForm").querySelector("button").disabled = false;
          }
        }
      });
      window.addEventListener("beforeunload", (e) => {
        if (pcQuickMemo.trim()) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      start();
    </script>
  </body>
</html>
